name: Validar datos y regenerar índice

on:
  push:
    branches: [main]
    paths: ["data/**", "scripts/**"]
  pull_request:
    paths: ["data/**", "scripts/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar
        run: python3 scripts/build.py --check
      - name: Regenerar index.json (solo en main)
        if: github.event_name == 'push'
        run: |
          python3 scripts/build.py
          if ! git diff --quiet data/index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/index.json
            git commit -m "Regenerar data/index.json"
            git push
          fi
