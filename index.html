<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valor real de las millas</title>
<meta name="description" content="Cuánto vale en dólares cada milla o punto, con el cálculo a la vista y la fuente de cada número. Argentina primero.">
<style>
  :root { --bg: #faf8f3; --ink: #1b1a17; --muted: #6b675e; --line: #e3dfd5; --card: #fff; --row: #f4f1ea; --accent: #0b5fff; --warn: #b45309; --stale: #8a1c1c; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141311; --ink: #ece8df; --muted: #a39d90; --line: #2b2925; --card: #1c1b18; --row: #201f1b; --accent: #6fa1ff; --warn: #f0b358; --stale: #ff9a9a; } }
  :root[data-theme="dark"] { --bg: #141311; --ink: #ece8df; --muted: #a39d90; --line: #2b2925; --card: #1c1b18; --row: #201f1b; --accent: #6fa1ff; --warn: #f0b358; --stale: #ff9a9a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .lead { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  a { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: baseline; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; border-top: 0; text-align: left; }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.p { cursor: pointer; }
  tr.p:hover td { background: var(--row); }
  tr.p td.name { font-weight: 600; }
  tr.p td.name small { font-weight: 400; color: var(--muted); margin-left: 6px; font-size: 12px; }
  tr.p td.num { font-weight: 700; font-size: 17px; }
  tr.p td.num.warn { color: var(--warn); }
  tr.p td.num.stale { color: var(--stale); }
  tr.p td.num small { font-weight: 400; font-size: 11px; color: var(--muted); margin-left: 3px; }
  tr.d td { background: var(--row); padding: 12px 14px 14px 28px; font-size: 13.5px; }
  .ref { margin: 0 0 8px; }
  .calc { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; color: var(--muted); white-space: pre-wrap; margin: 0 0 8px; }
  .calc b { color: var(--ink); }
  .src { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .src a { word-break: break-all; }
  .alts { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .alts div { display: flex; gap: 12px; justify-content: space-between; padding: 2px 0; }
  .alts .v { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
  .alts .m { color: var(--muted); }
  .foot { margin-top: 18px; color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .cta { display: inline-block; padding: 7px 12px; background: var(--accent); color: #fff; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Valor real de las millas</h1>
  <p class="lead">Centavos de dólar por milla o punto, medidos sobre el canje que la gente hace de verdad: precio real de mercado menos tasas, dividido por los puntos. Tocá un programa para ver la cuenta y la fuente. <a href="METODO.md">Método</a> · <a href="https://github.com/leopiccioli/valor-millas">Datos</a></p>
  <table>
    <thead><tr><th>Programa</th><th class="num">¢ por punto</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="foot">
    <a class="cta" href="https://github.com/leopiccioli/valor-millas/issues/new?template=medicion.yml">Proponer una medición</a>
    <span id="meta"></span>
  </div>
</main>
<script>
const fmtUSD = n => n.toLocaleString('es-AR', { style: 'currency', currency: 'USD', maximumFractionDigits: 2 });
const fmtN = n => n.toLocaleString('es-AR');
const cpp = c => c == null ? '—' : c.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: c < 0.1 ? 3 : 2 });
const money = m => `${fmtN(m.amount)} ${m.currency}`;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const link = s => /^https?:\/\//.test(s) ? `<a href="${esc(s)}" rel="noopener">${esc(s.replace(/^https?:\/\/(www\.)?/, '').slice(0, 55))}${s.length > 63 ? '…' : ''}</a>` : esc(s);
const short = n => n.replace(/ \(.*\)$/, '');

function calc(m, unit) {
  const ars = x => x.currency === 'ARS' ? ` = ${fmtUSD(x.amount / m.fx.rate)} (MEP ${fmtN(m.fx.rate)})` : '';
  return `cash    ${money(m.cash)}${ars(m.cash)}
tasas   ${money(m.fees)}${ars(m.fees)}${m.fees.estimated ? '   ← estimado' : ''}
puntos  ${fmtN(m.points)}
<b>(${fmtUSD(m.cash_usd)} − ${fmtUSD(m.fees_usd)}) ÷ ${fmtN(m.points)} = ${cpp(m.cents_per_point)} ¢ por ${unit}</b>`;
}

function detail(p, ref, byId) {
  const m = ref?.latest;
  let h = '';
  if (m) {
    h += `<div class="ref"><b>${esc(ref.label)}</b>${m.window ? ` <span class="src">· ${esc(m.window)}</span>` : ''}</div>`;
    h += `<div class="calc">${calc(m, p.unit)}</div>`;
    h += `<div class="src">Cash: ${link(m.cash.source)}${m.cash.note ? ` — ${esc(m.cash.note)}` : ''}</div>`;
    if (m.fees.source) h += `<div class="src">Tasas: ${link(m.fees.source)}${m.fees.note ? ` — ${esc(m.fees.note)}` : ''}</div>`;
    if (m.notes) h += `<div class="src">${esc(m.notes)}</div>`;
    h += `<div class="src">Medido por ${esc(m.author)} el ${m.date}${m.stale ? ` · <b>vencida</b> (${m.age_days} días)` : ''}.</div>`;
  } else {
    h += `<div class="src">Sin medición de referencia todavía.</div>`;
  }
  const others = p.alternatives.filter(a => a !== ref && a.latest);
  const xfers = (p.transfers || []).map(t => {
    const dest = byId[t.to]; const rate = t.to_points / t.from_points;
    const via = dest?.reference_cents_per_point != null ? rate * dest.reference_cents_per_point : null;
    return { label: `Transferir a ${dest ? esc(short(dest.name)) : esc(t.to)}: ${fmtN(t.from_points)} → ${fmtN(t.to_points)}`, v: via, note: via != null ? `vía ${esc(short(dest.name))}` : 'sin valor de destino' };
  });
  if (others.length || xfers.length) {
    h += `<div class="alts">`;
    for (const a of others) h += `<div><span>${esc(a.label)}${a.latest.estimated ? ' <span class="m">(tasas estimadas)</span>' : ''}${a.latest.stale ? ' <span class="m">(vencida)</span>' : ''}</span><span class="v">${cpp(a.latest.cents_per_point)} ¢</span></div>`;
    for (const x of xfers) h += `<div><span>${x.label} <span class="m">${x.note}</span></span><span class="v">${x.v != null ? cpp(x.v) + ' ¢' : '—'}</span></div>`;
    h += `</div>`;
  }
  return h;
}

async function main() {
  const idx = await (await fetch('data/index.json')).json();
  const byId = Object.fromEntries(idx.programs.map(p => [p.id, p]));
  const progs = [...idx.programs].sort((a, b) => (b.reference_cents_per_point ?? -1) - (a.reference_cents_per_point ?? -1));
  document.getElementById('meta').textContent = `${progs.length} programas · actualizado ${idx.generated}`;
  const tb = document.getElementById('tb');
  tb.innerHTML = progs.map(p => {
    const ref = p.alternatives.find(a => a.id === p.reference_alternative);
    const m = ref?.latest;
    const cls = m?.stale ? ' stale' : m?.estimated ? ' warn' : '';
    const flag = m?.stale ? '<small>vencido</small>' : m?.estimated ? '<small>estimado</small>' : '';
    return `<tr class="p" data-id="${esc(p.id)}"><td class="name">${esc(short(p.name))}</td><td class="num${cls}">${cpp(p.reference_cents_per_point)}${flag}</td></tr>
      <tr class="d" hidden data-for="${esc(p.id)}"><td colspan="2">${detail(p, ref, byId)}</td></tr>`;
  }).join('');
  tb.addEventListener('click', e => {
    const tr = e.target.closest('tr.p'); if (!tr) return;
    const d = tb.querySelector(`tr.d[data-for="${tr.dataset.id}"]`); d.hidden = !d.hidden;
  });
}
main().catch(e => { document.getElementById('tb').innerHTML = `<tr><td colspan="2">No se pudo cargar data/index.json (${esc(e.message)}).</td></tr>`; });
</script>
</body>
</html>
